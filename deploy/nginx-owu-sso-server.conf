# Include this file inside the OWU HTTPS `server {}` block after the TLS and
# upstream definitions. It uses Nginx auth_request, so the application never
# receives OAuth client secrets or bearer tokens.

auth_request /oauth2/auth;
error_page 401 = @owu_sso_signin;

# OAuth2 Proxy's public callback/start/sign-out surface must not recurse back
# into auth_request.
location ^~ /oauth2/ {
    auth_request off;
    proxy_pass http://owu_sso_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Auth-Request-Redirect $scheme://$http_host$request_uri;
    proxy_set_header Connection "";
    proxy_buffering off;
}

location = /oauth2/auth {
    auth_request off;
    internal;
    proxy_pass http://owu_sso_backend/oauth2/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Auth-Request-Redirect $scheme://$http_host$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location @owu_sso_signin {
    return 302 /oauth2/start?rd=$scheme://$http_host$request_uri;
}

# Keep discovery documents public so crawlers and AI assistants can understand
# the project even when browse/socket/tunnel routes require SSO.
location = /robots.txt {
    auth_request off;
    proxy_pass http://owu_ui_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

location = /sitemap.xml {
    auth_request off;
    proxy_pass http://owu_ui_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

location = /llms.txt {
    auth_request off;
    proxy_pass http://owu_ui_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}
