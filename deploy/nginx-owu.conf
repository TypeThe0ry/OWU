# Shared-host profile.
#
# - 443 is the primary HTTPS/WSS entry.
# - 8080 is a TLS/WSS fallback; use https://host:8080 and wss://host:8080.
# - 8443 and 9443 are additional TLS/WSS fallbacks.
# - 80 remains ordinary HTTP so this file can coexist with other HTTP virtual
#   hosts on the same address. It redirects browser traffic to 443 and is not a
#   WebSocket tunnel endpoint.
#
# To run TLS/WSS on port 80, use nginx-owu-dedicated-port80-tls.conf instead,
# on a dedicated address where no cleartext HTTP virtual host uses port 80.

# This file is loaded from nginx.conf's http context. Keep the cache path,
# request maps, and upstream pools at this level (outside server blocks).
# Create /var/cache/nginx/owu-media for the Nginx worker before reloading.
proxy_cache_path /var/cache/nginx/owu-media
    levels=1:2
    keys_zone=owu_media:64m
    max_size=4g
    min_free=4g
    inactive=24h
    use_temp_path=off;

map $request_method $owu_cache_unsafe_method {
    default 1;
    GET     0;
    HEAD    0;
}

map $http_range $owu_cache_range_request {
    default 1;
    ""      0;
}

# Range and validators take a hard uncached route. This is stronger than only
# setting proxy_cache_bypass: some global Nginx proxy-cache profiles suppress
# Range/If-Range before proxying unless the selected location disables cache.
map "$http_range|$http_if_range|$http_if_match|$http_if_none_match|$http_if_modified_since|$http_if_unmodified_since" $owu_uncached_conditional_request {
    default 1;
    "|||||" 0;
}

map $http_cache_control $owu_cache_client_bypass {
    default                         0;
    ~*(?:no-cache|no-store|max-age=0) 1;
}

map $http_pragma $owu_cache_pragma_bypass {
    default     0;
    ~*no-cache  1;
}

map $upstream_http_set_cookie $owu_cache_response_sets_cookie {
    default 1;
    ""      0;
}

# Go emits both values only after checking the original target response is a
# public static/media 200 with no target Cookie, Set-Cookie, private/no-store,
# or Authorization state. A target-provided X-Accel-* header is stripped by Go.
# The downstream Cache-Control is intentionally private for the browser; this
# marker plus TTL is the separate, sole shared-cache permission.
map $upstream_http_x_owu_cache $owu_cache_missing_public_marker {
    default       1;
    public-media  0;
}

map $upstream_http_x_accel_expires $owu_cache_invalid_edge_ttl {
    default          1;
    ~^[1-9][0-9]*$   0;
}

# Defense in depth: even a bad marker cannot put HTML/API payloads in the
# shared edge cache. Bilibili/Douyin media commonly use video/* or
# application/octet-stream; manifests, images, fonts, JS, and WASM are
# included for page-start performance.
map $upstream_http_content_type $owu_cache_non_public_media_type {
    default 1;
    ~*^(?:video|audio|image|font)/ 0;
    ~*^text/css 0;
    ~*^text/javascript 0;
    ~*^application/(?:javascript|x-javascript|wasm|font-woff|octet-stream|vnd\.ms-fontobject|vnd\.apple\.mpegurl|x-mpegurl|dash\+xml) 0;
    ~*^binary/octet-stream 0;
}

map $upstream_http_content_disposition $owu_cache_attachment_response {
    default       0;
    ~*attachment  1;
}

upstream owu_ui_backend {
    server 127.0.0.1:3210;
    keepalive 16;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

upstream owu_proxy_backend {
    server 127.0.0.1:3211;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen [::]:80;
    server_name owu.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 8080 ssl;
    listen [::]:8080 ssl;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    listen 9443 ssl;
    listen [::]:9443 ssl;

    server_name owu.example.com;

    # HTTP/2 substantially reduces connection pressure for media pages with
    # many scripts, images, manifests, and segment requests.
    http2 on;

    ssl_certificate /www/server/nginx/ssl/owu-selfsigned.crt;
    ssl_certificate_key /www/server/nginx/ssl/owu-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OWU:10m;
    ssl_session_timeout 10m;

    # Requests arrive through Cloudflare; restore the real visitor address from
    # CF-Connecting-IP (trusted only for Cloudflare source ranges) so anonymous
    # unique-visitor counting sees one entry per person, not one per edge IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Proxy paths contain an encoded upstream origin and may contain sensitive
    # query strings. Keep access logging off unless a target-free log format is
    # configured in nginx.conf's http block.
    access_log off;
    error_log /www/wwwlogs/owu-error.log;
    client_max_body_size 64m;
    keepalive_timeout 75s;
    keepalive_requests 10000;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # SPA-compatible virtual document URLs keep the target pathname visible to
    # client routers and append a versioned origin token in the raw query.
    # Dispatch these before normal UI/static location selection, including /,
    # /_next/, and favicon-shaped target paths. Go validates and removes only
    # the final decodable marker before forwarding upstream.
    error_page 418 = @owu_virtual_document;
    error_page 419 = @owu_uncached_browse;
    if ($args ~ '(^|&)__owu_origin_v1=[A-Za-z0-9_-]+(&|$)') {
        return 418;
    }

    location @owu_virtual_document {
        proxy_pass http://owu_proxy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_socket_keepalive on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = / {
        proxy_pass http://owu_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;
        proxy_cache off;
    }

    location ^~ /_next/ {
        proxy_pass http://owu_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;
        proxy_cache off;
    }

    location = /manifest.webmanifest {
        proxy_pass http://owu_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;
        proxy_cache off;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/manifest+json" always;
    }

    # Anonymous usage statistics: the UI page (/stats) and the JSON feed
    # (/stats/api, served by the Go proxy data plane).
    location = /stats {
        proxy_pass http://owu_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;
        proxy_cache off;
    }

    location = /stats/api {
        proxy_pass http://owu_proxy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;
        proxy_cache off;
    }

    location ~ ^/(?:og\.png|favicon\.ico|favicon\.svg|favicon-32\.png|apple-touch-icon\.png|icon-192\.png|icon-512\.png|file\.svg|globe\.svg|window\.svg)$ {
        proxy_pass http://owu_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;
        proxy_cache off;
    }

    location ^~ /socket/ {
        proxy_pass http://owu_proxy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ^~ /tunnel/ {
        proxy_pass http://owu_proxy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-OWU-Tunnel-Key $http_x_owu_tunnel_key;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Dedicated byte-range/validator path. Explicit cache-off plus explicit
    # forwarding prevents an inherited global cache from turning 206 into a
    # full 200 response, which is fatal to Bilibili/Douyin seeking.
    location @owu_uncached_browse {
        proxy_pass http://owu_proxy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-Match $http_if_match;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_set_header If-Unmodified-Since $http_if_unmodified_since;
        proxy_socket_keepalive on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header X-OWU-Cache;
        add_header X-OWU-Cache-Status BYPASS always;
    }

    # Canonical target resources are the only cache-eligible request surface.
    # The encoded origin is part of $request_uri, so different destinations
    # cannot share an object even when their path names match.
    location ^~ /browse/ {
        if ($owu_uncached_conditional_request) {
            return 419;
        }

        proxy_pass http://owu_proxy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        # Preserve byte-range semantics even when an enclosing Nginx config has
        # inherited proxy-cache directives. Range/If-Range requests bypass and
        # never populate the edge cache, so a 206 cannot poison a full object.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_socket_keepalive on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_temp_file_write_size 256k;
        proxy_max_temp_file_size 1024m;

        proxy_cache owu_media;
        proxy_cache_methods GET HEAD;
        # Go transparently decodes upstream compression before this hop, so
        # Accept-Encoding is not a cache-key dimension here. Nginx may compress
        # the identity object for each downstream client.
        # The complete Cookie header deliberately forms part of the private
        # cache context. This permits unrelated OWU target cookies without
        # sharing an object across browser session states. Keep this directory
        # private because Nginx cache metadata contains the raw key.
        proxy_cache_key "$scheme|$host|$remote_user|$request_uri|$http_cookie|$http_range";
        proxy_cache_bypass
            $owu_cache_unsafe_method
            $owu_cache_range_request
            $owu_cache_client_bypass
            $owu_cache_pragma_bypass;
        proxy_no_cache
            $owu_cache_unsafe_method
            $owu_cache_range_request
            $owu_cache_response_sets_cookie
            $owu_cache_missing_public_marker
            $owu_cache_invalid_edge_ttl
            $owu_cache_non_public_media_type
            $owu_cache_attachment_response;
        proxy_cache_valid 200 10m;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_force_ranges on;

        # Keep the internal cache contract private; expose only HIT/MISS/BYPASS
        # for repeatable deployment and performance checks.
        proxy_hide_header X-OWU-Cache;
        add_header X-OWU-Cache-Status $upstream_cache_status always;
    }

    # Referer-based compatibility fallback for root-relative requests. Keep it
    # outside the shared cache because the destination is not encoded in the
    # visible URI and therefore cannot form a self-contained cache key.
    location / {
        proxy_pass http://owu_proxy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_socket_keepalive on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }
}
