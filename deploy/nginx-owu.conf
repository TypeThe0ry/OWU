server {
    listen 80;
    listen [::]:80;
    server_name 8.219.11.175;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 8.219.11.175;

    ssl_certificate /www/server/nginx/ssl/owu-selfsigned.crt;
    ssl_certificate_key /www/server/nginx/ssl/owu-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OWU:10m;
    ssl_session_timeout 10m;

    auth_basic "OWU Private Proxy";
    auth_basic_user_file /www/server/nginx/conf/owu.htpasswd;

    access_log /www/wwwlogs/owu-access.log;
    error_log /www/wwwlogs/owu-error.log;
    client_max_body_size 64m;

    location = / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ~ ^/(?:og\.png|favicon\.svg|file\.svg|globe\.svg|window\.svg)$ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ^~ /socket/ {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
