# Dedicated-address profile.
#
# This standalone configuration provides HTTPS/WSS on 80, 443, 8080, 8443,
# and 9443. Use it only when the bound address has no cleartext HTTP virtual
# hosts on port 80. Do not load it together with nginx-owu.conf.
server {
    listen 80 ssl default_server;
    listen [::]:80 ssl default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 8080 ssl default_server;
    listen [::]:8080 ssl default_server;
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    listen 9443 ssl default_server;
    listen [::]:9443 ssl default_server;

    server_name owu.example.com;

    ssl_certificate /www/server/nginx/ssl/owu-selfsigned.crt;
    ssl_certificate_key /www/server/nginx/ssl/owu-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OWU:10m;
    ssl_session_timeout 10m;

    auth_basic "OWU Private Proxy";
    auth_basic_user_file /www/server/nginx/conf/owu.htpasswd;

    # Proxy paths contain an encoded upstream origin and may contain sensitive
    # query strings. Keep access logging off unless a target-free log format is
    # configured in nginx.conf's http block.
    access_log off;
    error_log /www/wwwlogs/owu-error.log;
    client_max_body_size 64m;

    # Route SPA virtual documents to Go before UI/static location selection.
    # The Go proxy validates the origin token and strips only its last valid
    # raw-query segment, preserving signed and duplicate target query values.
    error_page 418 = @owu_virtual_document;
    if ($args ~ '(^|&)__owu_origin_v1=[A-Za-z0-9_-]+(&|$)') {
        return 418;
    }

    location @owu_virtual_document {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Content-Type;
        add_header Content-Type "application/manifest+json" always;
    }

    location ~ ^/(?:og\.png|favicon\.ico|favicon\.svg|favicon-32\.png|apple-touch-icon\.png|icon-192\.png|icon-512\.png|file\.svg|globe\.svg|window\.svg)$ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ^~ /socket/ {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /tunnel/ {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-OWU-Tunnel-Key $http_x_owu_tunnel_key;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
